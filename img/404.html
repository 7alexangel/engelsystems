<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found — Engel Systems</title>
  <style>
    body {
      background: #20292e;
      color: #f4f4f4;
      font-family: "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .err-container {
      background: rgba(32, 41, 46, 0.97);
      border-radius: 24px;
      box-shadow: 0 2px 16px 0 #131c2a44;
      max-width: 420px;
      padding: 44px 28px 36px 28px;
      text-align: center;
    }
    .err-logo {
      margin-bottom: 22px;
    }
    .err-logo img {
      width: 105px;
      max-width: 60vw;
      border-radius: 12px;
    }
    .err-code {
      font-size: 2.7rem;
      font-weight: bold;
      color: #6cb8e6;
      margin-bottom: 8px;
      letter-spacing: 3px;
    }
    .err-title {
      font-size: 1.33rem;
      color: #a2b4c4;
      margin-bottom: 14px;
      font-weight: 600;
    }
    .err-desc {
      color: #bac6cf;
      font-size: 1rem;
      margin-bottom: 20px;
      line-height: 1.5;
    }
    .err-links a {
      display: inline-block;
      margin: 6px 10px 0 10px;
      color: #6cb8e6;
      text-decoration: underline;
      font-weight: 500;
      font-size: 1.07rem;
      transition: color 0.16s;
    }
    .err-links a:hover {
      color: #22c860;
    }
    @media (max-width: 550px) {
      .err-container { padding: 23px 5vw 26px 5vw; }
      .err-logo img { width: 64px; }
      .err-code { font-size: 2rem; }
    }
  </style>
</head>
<body>
    <div class="err-code">404</div>
    <div class="err-title">Page Not Found</div>
    <div class="err-desc">
      Sorry, the page you are looking for doesn't exist,<br>
      was moved, or removed.<br>
      <br>
      If you believe this is a mistake, please contact us.
    </div>
    <div class="err-links">
      <a href="https://engelsystems.com">Home</a>
      <a href="mailto:info@engelsystems.com">Contact Support</a>
    </div>
  </div>
  <div style="text-align:center; color:#8a98a7; font-size:0.78rem; margin:25px 0 12px 0; letter-spacing:0.01em;">
    Copyright &copy; 2026 All rights reserved &bull; Engel Systems
  </div>
</body>
</html>
